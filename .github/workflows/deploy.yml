name: deploy

# Releases are git tags: `git tag v1.0.1 && git push --tags` builds and
# publishes the site. workflow_dispatch redeploys the current ref manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A custom domain (public/CNAME) and a user/organization site
      # (<owner>.github.io) live at the domain root; a project site lives at
      # /<repo>/ and the app must be built with it.
      - id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -f public/CNAME ] || [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      # Sync providers: PUBLIC OAuth client ids (PKCE — there is no secret),
      # kept as repository variables (Settings → Secrets and variables →
      # Actions → Variables). An unset one hides that provider.
      - run: pnpm build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
          VITE_YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
          VITE_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
